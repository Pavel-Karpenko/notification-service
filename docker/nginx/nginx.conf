events {
    worker_connections 1024;
}

http {
    # Docker's internal DNS — re-resolve every 5 s so nginx picks up new replicas
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Access log to stdout for docker logs visibility
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen 80;

        # Pass through X-Request-ID from client; app echoes or generates it
        location / {
            set $upstream http://app:3000;
            proxy_pass $upstream;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $http_x_request_id;

            # Keep-alive to upstreams
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }
    }
}
